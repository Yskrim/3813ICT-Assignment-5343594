<!-- channel page -->
<div class="h-100 d-flex flex-column">
	<div class="card p-4 flex-grow">
		<!-- channel header -->
		<div class="d-flex flex-column">
			<h6>{{ group()?.name }} /</h6>
			<h4 class="">{{ channel()?.name }}</h4>
			<div class="d-flex gap-2">
				<button class="btn btn-sm btn-primary" (click)="goBack()">Go back</button>
				<button class="btn btn-sm btn-outline-primary" [routerLink]="['/groups', groupId, 'channels', channelId, 'info']">
					Channel info
				</button>
			</div>
		</div>
	</div>
	<!-- channel body -->
	<div class="card h-100 overflow-scroll d-flex flex-column">
		@for (msg of messages(); track msg.id) {
			<!-- row -->
			<div class="d-flex flex-row justify-content-end">
				<!-- message -->
				<div>
					<div class="px-3 py-2 me-3 mb-1 text-white rounded-3 bg-primary">
						{{ msg.text }}
					</div>
					<!-- @if (msg.senderId === user()?.id) {
                 <button type="button" class="btn btn-sm btn-outline-danger">Delete</button>
                 <button type="button" class="btn btn-sm btn-outline-info">Edit</button>
               } -->
				</div>
			</div>
			<div class="small me-3 mb-3 rounded-3 text-muted">{{ msg.senderId }}</div>
			<div class="small me-3 mb-3 rounded-3 text-muted">{{ msg.createdAt }}</div>
		}
	</div>

	<!-- channel input group -->
	<div class="pt-3">
		<form name="message input form" [formGroup]="msgInputForm" (ngSubmit)="send()" class="d-flex gap-2">
			<input class="form-control flex-grow-1" formControlName="message" type="text" placeholder="Type your message..." />
			<button type="submit" [disabled]="!msgInputForm.value.message?.trim()" class="btn btn-primary">Send</button>
		</form>
	</div>
</div>
