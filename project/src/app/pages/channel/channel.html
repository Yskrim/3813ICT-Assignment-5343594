<!-- channel page -->
<div class="h-100 d-flex flex-column ms-3">
	<!-- channel header -->
	<header class="card rounded-4 mb-3">
		<div class="d-flex align-items-center gap-3 py-2 px-3">
			<a (click)="goBack()" class="btn btn-sm btn-light rounded-3">←</a>

			<div class="flex-grow-1 text-truncate">
				<h5 class="mb-0 fw-semibold text-truncate">{{ channel()?.name }}</h5>
				<small class="text-body-secondary">
					<a [routerLink]="['/groups', groupId]" class="text-body-secondary text-decoration-none">{{ group()?.name }}</a> · {{ members().length }} members
				</small>
			</div>

			<a [routerLink]="['/groups', groupId, 'channels', channelId, 'info']" class="btn btn-sm btn-light rounded-3">ⓘ</a>
		</div>
	</header>

	<!-- channel body -->
	<div class="py-3 card h-100 overflow-scroll d-flex flex-column align-items-end rounded-4">
		@for (msg of messages(); track msg.id) {
			<!-- row -->
			<div class="d-flex flex-row justify-content-end">
				<!-- message -->
				<div>
					<div class="px-3 py-2 me-3 mb-1 text-white rounded-3 bg-primary">
						{{ msg.text }}
					</div>
					<!-- @if (msg.senderId === user()?.id) {
                 <button type="button" class="btn btn-sm btn-outline-danger">Delete</button>
                 <button type="button" class="btn btn-sm btn-outline-info">Edit</button>
               } -->
				</div>
			</div>
			<div class="small me-3 mb-3 rounded-3 text-muted">{{ msg.senderId }}</div>
			<div class="small me-3 mb-3 rounded-3 text-muted">{{ msg.createdAt }}</div>
		}
	</div>

	<!-- channel input group -->
	<div class="pt-3">
		<form name="message input form" [formGroup]="msgInputForm" (ngSubmit)="send()" class="d-flex gap-2">
			<input
				class="form-control flex-grow-1 p-3 rounded-4"
				formControlName="message"
				type="text"
				placeholder="Type your message..."
			/>
			<button type="submit" [disabled]="!msgInputForm.value.message?.trim()" class="btn btn-primary p-3 rounded-4">
				Send
			</button>
		</form>
	</div>
</div>
