<!-- login / register page -->
<div class="container" style="max-width: 400px">
	<div class="card border-0 shadow-sm rounded-4 p-4 mt-5">
		<h4 class="mb-3">
			{{ mode() === 'login' ? 'Log in to your account' : 'Create an account' }}
		</h4>

		<form (ngSubmit)="onSubmit()" novalidate>
			<label class="form-label small" for="username">Username</label>
			<input id="username" class="form-control mb-2" name="username" autocomplete="username" [(ngModel)]="username" />

			<!-- register only -->
			@if (mode() === 'register') {
				<label class="form-label small" for="displayName">Display name</label>
				<input id="displayName" class="form-control mb-2" name="displayName" [(ngModel)]="displayName" />
				<div class="form-text mb-2">Username: 3-20 letters, digits or _ (optional &#64; in front)</div>
			}

			<label class="form-label small" for="password">Password</label>
			<input
				id="password"
				class="form-control mb-4"
				name="password"
				type="password"
				[autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"
				[(ngModel)]="password"
			/>

			<button class="btn btn-primary w-100" type="submit" [disabled]="loading()">
				@if (loading()) {
					Please wait...
				} @else {
					{{ mode() === 'login' ? 'Log in' : 'Create account' }}
				}
			</button>

			@if (error()) {
				<p class="text-danger small mt-2 mb-0" role="alert">{{ error() }}</p>
			}
		</form>

		<!-- switch mode -->
		<p class="small text-center mt-3 mb-0">
			{{ mode() === 'login' ? 'No account yet?' : 'Already have an account?' }}
			<button type="button" class="btn btn-link btn-sm p-0 align-baseline" (click)="toggleMode()">
				{{ mode() === 'login' ? 'Create one' : 'Log in' }}
			</button>
		</p>
	</div>
</div>
