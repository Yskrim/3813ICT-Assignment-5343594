<!-- user profile page -->

<h4 class="mb-3">User Profile</h4>
<div class="card p-4 d-flex flex-row align-items-start">
	<img class="img-fluid rounded border me-4" src="{{ avatarUrl }}" alt="User profile image" />

	@if (user) {
		<div class="flex-grow-1">
			<div class="d-flex align-items-center mb-1">
				<span class="fw-bold fs-4 me-2">{{ displayName }}</span>
				<span class="text-muted fs-5">{{ username }}</span>
			</div>
			<div class="mb-2 text-secondary">Age: {{ age }}</div>
			<div class="mb-3">
				<div class="fw-bold mb-1">Bio:</div>
				<p class="mb-0 text-secondary">
					{{ bio }}
				</p>
			</div>
			<div class="d-flex gap-2 mt-3">
				<button class="btn btn-primary" routerLink="/channel">Send Message</button>
				<button class="btn btn-outline-primary disabled" tabindex="-1" aria-disabled="true">
					Invite to channel
				</button>
			</div>
		</div>
	}
</div>
