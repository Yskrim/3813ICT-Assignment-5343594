@if (user) {
	<nav name="home nav">
		<p>{{ user.username }} · {{ user.role }}</p>
		<h4 class="mb-4">Account Settings</h4>
	</nav>

	<div class="d-flex form-control p-3 align-items-center mb-2">
		<label class="mb-0 flex-grow-1">
			Display Name:
			<input
				[(ngModel)]="displayName"
				class="mx-2 form-control form-control-sm d-inline-block w-auto"
			/>
		</label>
		<button type="button" class="btn btn-sm btn-outline-primary" (click)="saveDisplayName()">
			Save
		</button>
	</div>

	<div class="d-flex form-control p-3 align-items-center mb-2">
		<label class="mb-0 flex-grow-1">
			Username:
			<input
				[(ngModel)]="username"
				class="mx-2 form-control form-control-sm d-inline-block w-auto"
			/>
		</label>
		<button type="button" class="btn btn-sm btn-outline-primary" (click)="saveUsername()">
			Save
		</button>
	</div>

	<div class="d-flex form-control p-3 align-items-center mb-2">
		<label class="mb-0 flex-grow-1">
			Password:
			<input
				[(ngModel)]="password"
				type="password"
				class="mx-2 form-control form-control-sm d-inline-block w-auto"
			/>
		</label>
		<button type="button" class="btn btn-sm btn-outline-primary" (click)="savePassword()">
			Save
		</button>
	</div>


	<img
		[src]="avatarUrl || 'https://placehold.co/130x130'"
		class="img-thumbnail mb-3"
		alt="Profile"
	/>
	<div class="d-flex form-control p-3 align-items-center mb-2">
		<label class="mb-0 flex-grow-1">
			Avatar URL:
			<input
				[(ngModel)]="avatarUrl"
				class="mx-2 form-control form-control-sm d-inline-block w-auto"
			/>
		</label>
		<button type="button" class="btn btn-sm btn-outline-primary" (click)="saveAvatar()">
			Save
		</button>
	</div>

	<div class="d-flex form-control p-3 align-items-center mb-2">
		<label class="mb-0 flex-grow-1">
			Danger zone (you won't be able to undo this)
		</label>
		<button type="button" class="btn btn-sm btn-outline-danger" (click)="deleteAccount()">
			Delete Account
		</button>
	</div>
	<button type="button" class="w-100 btn btn-primary my-4" (click)="logout()">Log out</button>
}
