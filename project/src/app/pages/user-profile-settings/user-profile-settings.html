@if (user) {
	<nav name="home nav">
		<p>{{ user.username }} · {{ user.role }}</p>
		<h4 class="mb-4">Account Settings</h4>
	</nav>

	<div class="d-flex form-control p-3 align-items-center mb-2">
		<label class="mb-0 flex-grow-1">
			Display Name:
			<input [(ngModel)]="displayName" class="mx-2 form-control form-control-sm d-inline-block w-auto" />
		</label>
		<button type="button" class="btn btn-sm btn-outline-primary" (click)="saveDisplayName()">Save</button>
	</div>

	<div class="d-flex form-control p-3 align-items-center mb-2">
		<label class="mb-0 flex-grow-1"> Username: @{{ username }}</label>
	</div>

	<div class="d-flex form-control p-3 align-items-center mb-2">
		<label class="mb-0 flex-grow-1">
			Password:
			<input [(ngModel)]="password" type="password" class="mx-2 form-control form-control-sm d-inline-block w-auto" />
		</label>
		<button type="button" class="btn btn-sm btn-outline-primary" (click)="savePassword()">Save</button>
	</div>

	<img
		[src]="avatarUrl || 'https://placehold.co/130x130'"
		class="img-thumbnail img-fluid mb-3"
		style="max-width: 200px"
		alt="Profile"
	/>
	<div class="d-flex form-control p-3 align-items-center mb-2">
		<label class="mb-0 flex-grow-1 flex-shrink-1">
			Avatar URL:
			<input [(ngModel)]="avatarUrl" class="mx-2 form-control form-control-sm d-inline-block w-auto" />
		</label>
		<button type="button" class="btn btn-sm btn-outline-primary" (click)="saveAvatar()">Save</button>
	</div>

	<div class="d-flex form-control p-3 align-items-center mb-2">
		<label class="mb-0 flex-grow-1">Danger zone (super admin must approve)</label>
		<button
			type="button"
			class="btn btn-sm btn-outline-danger"
			[disabled]="deleteStatus() === 'sent'"
			(click)="deleteAccount()"
		>
			Request deletion
		</button>
	</div>

	@if (deleteStatus() === 'sent') {
		<div class="alert alert-info py-2 small" role="alert">
			Request sent. Your account will be deleted after super admin approves it.
		</div>
	} @else if (deleteStatus() === 'error') {
		<div class="alert alert-danger py-2 small" role="alert">Could not send request, try again.</div>
	}
	<button type="button" class="w-100 btn btn-primary my-4" (click)="logout()">Log out</button>
}
