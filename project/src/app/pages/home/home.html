<!-- home: sidebar with groups + channels, main area empty state -->
<div class="home container-fluid pb-3">
	<div class="d-flex h-100">
		<app-sidebar [groups]="groups()" [channelsByGroup]="channelsByGroup()" (joined)="loadGroups()"></app-sidebar>

		<main class="col-md-8 col-lg-9 h-100">
			<router-outlet #homeOutlet="outlet"></router-outlet>
			@if (!homeOutlet.isActivated) {
				<div class="card h-100 d-flex flex-column justify-content-center align-items-center ms-3 rounded-4">
					<h4 class="mb-2">Select a channel</h4>
					<p class="text-body-secondary">Pick a channel on the left to start chatting with your group.</p>
				</div>
			}
		</main>
	</div>
</div>
