<!-- group info page -->

<div class="card p-4">
	<div class="mb-4">
		<h6 class="text-muted">Group Info</h6>
		<h4 class="mb-4">{{ group?.name }}</h4>
		<div class="d-flex gap-2">
			<button class="btn btn-sm btn-primary" (click)="goBack()">Go back</button>
			<button class="btn btn-sm btn-outline-primary">Change name</button>
			<button class="btn btn-sm btn-outline-primary">Change image</button>
			<button class="btn btn-sm btn-outline-primary">Change theme</button>
			<button class="btn btn-sm btn-outline-danger">Delete group</button>
		</div>
	</div>

	<div>
		<div class="mb-4">
			<div class="mb-2 fw-bold">Channels</div>
			<ul class="list-group">
				
				@for (ch of channels; track ch.id) {
					<li class="list-group-item d-flex justify-content-between align-items-center">
						<a [routerLink]="['/groups', gId, 'channels', ch.id]">{{ ch.name }}</a>

						<button [routerLink]="['/groups', gId, 'channels', ch.id]" class="btn btn-sm">Open</button>
					</li>
				}

			</ul>
		</div>

		<div>
			<div class="mb-2 fw-bold">People</div>
			<ul class="list-group">

				@for (mem of members; track mem.id) {
					<li class="list-group-item">
						<div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2">
							<div>
								<a routerLink="/profile" class="fw-semibold">{{
									mem.displayName
								}}</a>
								<div class="text-muted">{{ mem.username }}</div>
								<div class="text-muted">Role: {{ mem.role }}</div>
							</div>
							<div class="d-flex gap-2">
								<button class="btn btn-sm btn-outline-warning">Kick</button>
								<button class="btn btn-sm btn-outline-danger">Ban</button>
								<button class="btn btn-sm btn-outline-primary">Make admin</button>
								<button class="btn btn-sm btn-outline-secondary">Report</button>
							</div>
						</div>
					</li>
				}
				
			</ul>
		</div>
	</div>
</div>
