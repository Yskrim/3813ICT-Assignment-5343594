<!-- group page -->
<div class="card p-4">
	<div class="mb-4">
		<h6 class="text-muted">Group Id: {{ gId }}</h6>
		<h4 class="mb-4">{{ group()?.name }}</h4>
		<div class="d-flex gap-2">
			<button class="btn btn-sm btn-primary" (click)="goBack()">Go back</button>
			<button class="btn btn-sm btn-outline-primary" [routerLink]="['/groups', gId, 'info']">Group Info</button>
			<button class="btn btn-sm btn-success" (click)="showRequestForm.set(!showRequestForm())">Request channel</button>
		</div>

		<!-- request new channel form -->
		@if (showRequestForm()) {
			<form class="card card-body mt-3 gap-2" [formGroup]="requestForm" (ngSubmit)="requestChannel()">
				<input class="form-control" formControlName="name" placeholder="Channel name" />
				<input class="form-control" formControlName="note" placeholder="Why do you need it? (optional)" />
				<div class="d-flex gap-2">
					<button
						type="submit"
						class="btn btn-sm btn-primary"
						[disabled]="requestForm.invalid || requestStatus() === 'sending'"
					>
						Send request
					</button>
					<button type="button" class="btn btn-sm btn-light" (click)="showRequestForm.set(false)">Cancel</button>
				</div>
			</form>
		}

		<!-- user feedback -->
		@if (requestStatus() === 'sent') {
			<div class="alert alert-success py-2 mt-3 mb-0">Request sent. An admin will review it.</div>
		}
		@if (requestStatus() === 'error') {
			<div class="alert alert-danger py-2 mt-3 mb-0">Could not send request. Try again.</div>
		}
	</div>
</div>
