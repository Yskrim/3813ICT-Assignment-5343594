<!-- group page -->
<div class="card p-4">

	<div class="mb-4">
		<h6 class="text-muted">Group Id: {{ gId }}</h6>
		<h4 class="mb-4">{{ group()?.name }}</h4>
		<div class="d-flex gap-2">
			<button class="btn btn-sm btn-primary" (click)="goBack()">Go back</button>
			<button class="btn btn-sm btn-outline-primary" [routerLink]="['/groups', gId, 'info']">Group Info</button>
			<button class="btn btn-sm btn-success" [routerLink]="['/groups', gId, 'channels', 'create']">Create Channel</button>
		</div>
	</div>

	<div class="mb-4">
		<div class="mb-2 fw-bold">
			<span class="text-muted" >{{ channels()?.length || 0 }} channel{{ channels()?.length === 1 ? '' : 's' }}</span>
		</div>
		<ul class="list-group">
			
			@for (ch of channels(); track ch.id) {
				<li class="list-group-item d-flex justify-content-between align-items-center">
					<a [routerLink]="['/groups', gId, 'channels', ch.id]">{{ ch.name }}</a>

					<button [routerLink]="['/groups', gId, 'channels', ch.id]" class="btn btn-sm">Open</button>
				</li>
			}
			
		</ul>
	</div>
</div>
